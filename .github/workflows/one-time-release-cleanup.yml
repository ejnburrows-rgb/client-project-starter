name: One-time NBO release cleanup

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/one-time-release-cleanup.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v5
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Verify NBO source
        run: |
          pnpm install --frozen-lockfile
          pnpm run lint
          pnpm run typecheck
          pnpm run build

      - name: Deploy root build to existing Vercel project when token is available
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_Ixkx4gmJy9k2mvBVDEeFsTQH
          VERCEL_PROJECT_ID: prj_qVK5RW2HCXHTfCpak0r1fP2satMN
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "deployed=false" >> "$GITHUB_OUTPUT"
            echo "No VERCEL_TOKEN secret available; deployment skipped."
            exit 0
          fi
          mkdir -p .vercel
          printf '{"orgId":"%s","projectId":"%s"}\n' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json
          npx --yes vercel@latest deploy --prod --yes --token "$VERCEL_TOKEN"
          echo "deployed=true" >> "$GITHUB_OUTPUT"

      - name: Delete superseded branches
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for b in             "dependabot/github_actions/actions/checkout-7"             "dependabot/github_actions/actions/setup-node-7"             "dependabot/github_actions/pnpm/action-setup-5"             "scaffold-template"
          do
            if git ls-remote --exit-code --heads origin "$b" >/dev/null 2>&1; then
              git push origin --delete "$b"
            fi
          done

      - name: Rename repository to NBO after successful Vercel replacement
        if: steps.deploy.outputs.deployed == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body             -X PATCH             -H "Authorization: Bearer $GH_TOKEN"             -H "Accept: application/vnd.github+json"             -H "X-GitHub-Api-Version: 2022-11-28"             "https://api.github.com/repos/${GITHUB_REPOSITORY}"             -d '{"name":"NBO"}'
